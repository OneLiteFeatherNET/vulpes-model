datasources:
  default:
    url: jdbc:h2:mem:vulpes;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
jpa:
  default:
    entity-scan:
      packages: net.onelitefeather.vulpes.api.model
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop
